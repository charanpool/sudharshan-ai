<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudharshan-AI | UPI Simulator</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- UPI Phone Mockup -->
        <div class="phone-mockup">
            <div class="status-bar">
                <span>12:45</span>
                <div class="icons">📶 🔋</div>
            </div>

            <div class="app-content" id="simulator-screen">
                <header>
                    <div class="back-btn">←</div>
                    <h1>Send Money</h1>
                </header>

                <div class="recipient-card">
                    <div class="avatar">SC</div>
                    <div class="info">
                        <h2>Sanjeev (CBI Officer)</h2>
                        <p>sanjeev.cbi@upi</p>
                    </div>
                </div>

                <div class="amount-container">
                    <span class="currency">₹</span>
                    <input type="number" id="amount-input" placeholder="0" autofocus>
                </div>

                <div class="note-container">
                    <input type="text" id="note-input" placeholder="Add a message...">
                </div>

                <div class="security-flags">
                    <span class="label">Currently on call</span>
                    <label class="switch">
                        <input type="checkbox" id="on-call-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>

                <button id="pay-btn" class="primary-btn">Pay Now</button>
            </div>

            <!-- Risk Modal -->
            <div id="risk-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="risk-ring">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle" id="risk-circle" stroke-dasharray="0, 100"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="20.35" class="percentage" id="risk-value">0%</text>
                        </svg>
                    </div>
                    <h3 id="risk-title">Analyzing...</h3>
                    <p id="risk-reason">Checking for signs of psychological coercion.</p>
                    <div class="modal-actions">
                        <button id="modal-close" class="secondary-btn">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar Dashboard -->
        <div class="dashboard-panel">
            <div class="panel-header">
                <img src="../../../docs/assets/logo-transparent.png" alt="Logo" width="48">
                <div>
                    <h2>Sudharshan-AI</h2>
                    <span class="badge">PROTOTYPE</span>
                </div>
            </div>

            <div class="live-telemetry">
                <h3>Live Telemetry</h3>
                <div class="stat">
                    <span>Typing Speed (WPM)</span>
                    <span id="stat-wpm">0</span>
                </div>
                <div class="stat">
                    <span>Hesitation Count</span>
                    <span id="stat-hesitations">0</span>
                </div>
                <div class="stat">
                    <span>Variance</span>
                    <span id="stat-variance">0</span>
                </div>
            </div>

            <div class="bedrock-thought">
                <h3>AI Thought Process</h3>
                <div class="thought-bubble" id="ai-thought">
                    Waiting for transaction signals...
                </div>
            </div>
        </div>
    </div>

    <script src="simulator.js"></script>
</body>

</html>
